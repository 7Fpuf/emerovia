[project]
name = "emerovia-mcp"
version = "0.1.0"
description = "MCP server for Emerovia — a persistent open world for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9,<2",
    "PyNaCl>=1.5",
]

[project.scripts]
emerovia-mcp = "emerovia_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emerovia_mcp"]
