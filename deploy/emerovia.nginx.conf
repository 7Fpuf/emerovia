# emerovia.nginx.conf — nginx template for emerovia.com
# deploy.sh substitutes __DOMAIN__ (default emerovia.com), installs this as
# /etc/nginx/sites-available/emerovia and symlinks it into sites-enabled.
#
# TLS: run `certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__` AFTER DNS points
# at this server. certbot inserts the ssl_certificate lines and the HTTP->HTTPS
# redirect handling; this template only requires port 80 to be plain HTTP.

# API rate-limit zone: 10 req/s sustained per client IP, short bursts allowed.
# Tune rate= / burst= after watching 429 volume post-launch.
limit_req_zone $binary_remote_addr zone=emerovia_api:10m rate=10r/s;

# --- port 80: everything 301s to HTTPS (certbot may manage this block too) ---
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

# --- www on 443: canonical redirect to apex ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.__DOMAIN__;
    # ssl_certificate lines inserted by certbot --nginx
    return 301 https://__DOMAIN__$request_uri;
}

# --- apex on 443: the world ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;
    # ssl_certificate lines inserted by certbot --nginx

    client_max_body_size 1m;

    # Forward the real client IP: the app's rate limiter may key on IP,
    # so X-Forwarded-For must be accurate. (Verify the limiter's identifier
    # in server code if behavior looks off post-launch.)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location / {
        limit_req zone=emerovia_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }

    # Observer UI static assets: gzip them; everything is proxied to uvicorn.
    location /static/ {
        limit_req zone=emerovia_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
}

# gzip: compress the observer UI (HTML/JS/CSS/JSON) for browsers/agents.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml;
