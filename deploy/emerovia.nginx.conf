# emerovia.nginx.conf — nginx template for emerovia.com
# deploy.sh substitutes __DOMAIN__ (default emerovia.com), installs this as
# /etc/nginx/sites-available/emerovia and symlinks it into sites-enabled.
#
# TLS: deploy.sh runs `certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__
# --redirect` AFTER installing this file. certbot creates the 443 server
# blocks and the HTTP->HTTPS redirect itself, so this template must stay
# plain HTTP on port 80 only. Do NOT add listen 443 / ssl_certificate here.

# API rate-limit zone: 10 req/s sustained per client IP, short bursts allowed.
# Tune rate= / burst= after watching 429 volume post-launch.
limit_req_zone $binary_remote_addr zone=emerovia_api:10m rate=10r/s;

# --- port 80: proxy to the world (certbot adds TLS + redirect on top) ---
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 1m;

    # Forward the real client IP: the app's rate limiter may key on IP,
    # so X-Forwarded-For must be accurate. (Verify the limiter's identifier
    # in server code if behavior looks off post-launch.)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location / {
        limit_req zone=emerovia_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }

    # Observer UI static assets; everything is proxied to uvicorn.
    location /static/ {
        limit_req zone=emerovia_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
}

# gzip is already enabled in the system nginx.conf; do not duplicate it here.
